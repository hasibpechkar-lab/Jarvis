<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0B0E14;
    --surface: #131820;
    --surface-raised: #1B222D;
    --text: #E8ECF1;
    --text-dim: #7C8797;
    --accent: #4FD1C5;
    --accent-dim: rgba(79, 209, 197, 0.18);
    --amber: #F2A65A;
    --amber-dim: rgba(242, 166, 90, 0.14);
    --danger: #E36767;
    --line: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 28px 20px 40px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }

  #clock {
    font-size: 13px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  /* Orb */
  .orb-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 0 20px;
  }

  .orb-btn {
    position: relative;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #1E2733, var(--surface) 70%);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px var(--line);
    transition: box-shadow 0.3s ease;
  }

  .orb-btn::before {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid var(--accent-dim);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .orb-btn.listening {
    box-shadow: 0 0 0 1px var(--accent), 0 0 40px 4px var(--accent-dim);
  }
  .orb-btn.listening::before {
    opacity: 1;
    animation: ripple 1.6s ease-out infinite;
  }
  .orb-btn.speaking {
    box-shadow: 0 0 0 1px var(--amber), 0 0 40px 4px var(--amber-dim);
  }

  @keyframes ripple {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  .orb-icon {
    width: 34px;
    height: 34px;
    stroke: var(--text);
    fill: none;
    stroke-width: 1.6;
    z-index: 1;
  }
  .orb-btn.listening .orb-icon { stroke: var(--accent); }
  .orb-btn.speaking .orb-icon { stroke: var(--amber); }

  .orb-status {
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
    text-align: center;
    max-width: 320px;
  }
  .orb-status.err { color: var(--danger); }

  .wake-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
  }
  .wake-row span {
    font-size: 13px;
    color: var(--text-dim);
  }
  .switch {
    position: relative;
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch.on {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .switch.on::after {
    transform: translateX(18px);
    background: var(--accent);
  }

  /* Transcript / response */
  .exchange {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .exchange .you {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 6px;
  }
  .exchange .said {
    font-size: 15px;
    margin: 0 0 14px;
    line-height: 1.5;
  }
  .exchange .them {
    font-size: 13px;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .exchange .reply {
    font-size: 15px;
    line-height: 1.55;
    margin: 0;
    white-space: pre-wrap;
  }

  #log { display: flex; flex-direction: column-reverse; gap: 10px; margin-bottom: 22px; }

  /* Text fallback input */
  .text-row {
    display: flex;
    gap: 8px;
    margin-bottom: 30px;
  }
  #textInput {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
  }
  #textInput:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  /* Reminders section */
  section.reminders h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 12px;
  }

  .add-reminder {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .add-reminder input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  .add-reminder input:focus { outline: none; border-color: var(--amber); }
  .add-reminder button {
    background: var(--amber-dim);
    border: 1px solid transparent;
    color: var(--amber);
    border-radius: 10px;
    padding: 0 14px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  ul#reminderList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  ul#reminderList li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
  }
  ul#reminderList li .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
  }
  ul#reminderList li .txt { flex: 1; }
  ul#reminderList li .when {
    font-size: 12px;
    color: var(--text-dim);
  }
  ul#reminderList li button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .empty-note {
    font-size: 13px;
    color: var(--text-dim);
    padding: 6px 2px;
  }
</style>

<div id="app">
  <header>
    <h1>ARIA</h1>
    <span id="clock">--:--</span>
  </header>

  <div class="orb-wrap">
    <button class="orb-btn" id="orbBtn">
      <svg class="orb-icon" viewBox="0 0 24 24">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="9" y1="22" x2="15" y2="22"/>
      </svg>
    </button>
    <p class="orb-status" id="orbStatus">Tap to talk</p>
    <div class="wake-row">
      <span>Wake word ("Hey Aria")</span>
      <div class="switch" id="wakeSwitch"></div>
    </div>
  </div>

  <div id="log"></div>

  <div class="text-row">
    <input id="textInput" type="text" placeholder="Or type instead…" />
    <button id="sendBtn">Send</button>
  </div>

  <section class="reminders">
    <h2>Reminders &amp; tasks</h2>
    <div class="add-reminder">
      <input id="reminderInput" type="text" placeholder="Add a reminder…" />
      <button id="addReminderBtn">Add</button>
    </div>
    <ul id="reminderList"></ul>
  </section>
</div>

<script>
(function () {
  const orbBtn = document.getElementById('orbBtn');
  const orbStatus = document.getElementById('orbStatus');
  const log = document.getElementById('log');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const reminderInput = document.getElementById('reminderInput');
  const addReminderBtn = document.getElementById('addReminderBtn');
  const reminderList = document.getElementById('reminderList');
  const clockEl = document.getElementById('clock');

  let history = []; // {role, content}
  let reminders = [];
  let isListening = false;

  // Clock
  function tickClock() {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  tickClock();
  setInterval(tickClock, 15000);

  // ---------- Storage ----------
  async function loadReminders() {
    try {
      const res = await window.storage.get('reminders', false);
      reminders = res ? JSON.parse(res.value) : [];
    } catch (e) {
      reminders = [];
    }
    renderReminders();
  }

  async function saveReminders() {
    try {
      await window.storage.set('reminders', JSON.stringify(reminders), false);
    } catch (e) {
      console.error('Could not save reminders', e);
    }
  }

  function renderReminders() {
    reminderList.innerHTML = '';
    if (reminders.length === 0) {
      const li = document.createElement('div');
      li.className = 'empty-note';
      li.textContent = 'Nothing on your list yet.';
      reminderList.appendChild(li);
      return;
    }
    reminders.forEach((r, i) => {
      const li = document.createElement('li');
      const dot = document.createElement('div');
      dot.className = 'dot';
      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = r.text;
      const when = document.createElement('div');
      when.className = 'when';
      when.textContent = r.addedAt;
      const del = document.createElement('button');
      del.textContent = '✕';
      del.onclick = async () => {
        reminders.splice(i, 1);
        await saveReminders();
        renderReminders();
      };
      li.appendChild(dot);
      li.appendChild(txt);
      li.appendChild(when);
      li.appendChild(del);
      reminderList.appendChild(li);
    });
  }

  async function addReminder(text) {
    if (!text || !text.trim()) return;
    reminders.unshift({
      text: text.trim(),
      addedAt: new Date().toLocaleDateString([], { month: 'short', day: 'numeric' })
    });
    await saveReminders();
    renderReminders();
  }

  addReminderBtn.onclick = () => {
    addReminder(reminderInput.value);
    reminderInput.value = '';
  };
  reminderInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { addReminder(reminderInput.value); reminderInput.value = ''; }
  });

  loadReminders();

  // ---------- Conversation log UI ----------
  function addExchange(said, reply) {
    const el = document.createElement('div');
    el.className = 'exchange';
    el.innerHTML = `
      <p class="you">You said</p>
      <p class="said"></p>
      <p class="them">ARIA</p>
      <p class="reply"></p>
    `;
    el.querySelector('.said').textContent = said;
    el.querySelector('.reply').textContent = reply;
    log.prepend(el);
  }

  // ---------- AI brain ----------
  async function askAI(userText) {
    const reminderContext = reminders.length
      ? 'Current reminders/tasks the user has saved: ' + reminders.map(r => r.text).join('; ') + '.'
      : 'The user has no saved reminders right now.';

    const systemPrompt = `You are ARIA, a warm, concise personal voice assistant living on the user's phone, in the spirit of a helpful AI companion. You help with daily life: quick questions, advice, reminders, small talk. Keep replies short and conversational, ideally 1-3 sentences, since they will often be read aloud. Avoid lists and markdown formatting — speak naturally. ${reminderContext} If the user asks you to remember or remind them of something, acknowledge it naturally in your reply (the app will save it separately), but do not claim to have set an alarm or notification unless asked to just note it down.`;

    history.push({ role: 'user', content: userText });
    if (history.length > 16) history = history.slice(-16);

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: history
      })
    });

    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    const reply = textBlock ? textBlock.text : "Sorry, I didn't catch that.";
    history.push({ role: 'assistant', content: reply });
    return reply;
  }

  // ---------- Speech output ----------
  function speak(text) {
    if (!('speechSynthesis' in window)) {
      if (wakeMode && recognizer) { try { recognizer.start(); } catch (e) {} }
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.02;
    utter.onstart = () => {
      speaking = true;
      if (recognizer && isListening) { try { recognizer.stop(); } catch (e) {} }
      setOrbState('speaking', 'Speaking…');
    };
    utter.onend = () => {
      speaking = false;
      if (wakeMode && recognizer) {
        try { recognizer.start(); } catch (e) {}
      } else {
        setOrbState('idle', 'Tap to talk');
      }
    };
    window.speechSynthesis.speak(utter);
  }

  function setOrbState(state, statusText, isError) {
    orbBtn.classList.remove('listening', 'speaking');
    if (state === 'listening') orbBtn.classList.add('listening');
    if (state === 'speaking') orbBtn.classList.add('speaking');
    orbStatus.textContent = statusText;
    orbStatus.classList.toggle('err', !!isError);
  }

  // ---------- Handle a finished user utterance ----------
  async function handleUserInput(text) {
    if (!text || !text.trim()) return;
    setOrbState('idle', 'Thinking…');
    try {
      const reply = await askAI(text.trim());
      addExchange(text.trim(), reply);
      speak(reply);
    } catch (e) {
      console.error(e);
      addExchange(text.trim(), "I couldn't reach the AI service just now.");
      setOrbState('idle', 'Tap to talk');
    }
  }

  // ---------- Speech recognition ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const wakeSwitch = document.getElementById('wakeSwitch');
  let recognizer = null;
  let wakeMode = false;      // user toggled wake-word mode on
  let awaitingCommand = false; // heard wake word, now capturing the actual request
  let manuallyStoppedForCommand = false;
  let speaking = false;

  const WAKE_PHRASES = ['hey aria', 'hey, aria', 'ok aria', 'okay aria'];

  function stripWakePhrase(text) {
    const lower = text.toLowerCase();
    for (const phrase of WAKE_PHRASES) {
      const idx = lower.indexOf(phrase);
      if (idx !== -1) {
        return text.slice(idx + phrase.length).replace(/^[,.\s]+/, '').trim();
      }
    }
    return null; // wake phrase not found
  }

  function errorMessage(err) {
    switch (err) {
      case 'not-allowed':
      case 'permission-denied':
        return 'Microphone blocked. If you\u2019re inside the Claude app preview, open this file directly in Chrome instead, then allow the mic.';
      case 'no-speech':
        return 'Didn\u2019t hear anything — tap to try again';
      case 'audio-capture':
        return 'No microphone found on this device';
      case 'network':
        return 'Speech service network error — try again';
      case 'aborted':
        return null; // normal stop, not a real error
      default:
        return 'Voice error: ' + err;
    }
  }

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.lang = 'en-US';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    recognizer.onstart = () => {
      isListening = true;
      if (awaitingCommand) {
        setOrbState('listening', 'Listening for your request…');
      } else if (wakeMode) {
        setOrbState('listening', 'Waiting for "Hey Aria"…');
      } else {
        setOrbState('listening', 'Listening…');
      }
    };

    recognizer.onerror = (event) => {
      isListening = false;
      const msg = errorMessage(event.error);
      if (msg) setOrbState('idle', msg, true);
      // 'not-allowed' usually means wake mode can't continue — turn it off
      if (event.error === 'not-allowed' || event.error === 'audio-capture') {
        wakeMode = false;
        wakeSwitch.classList.remove('on');
      }
    };

    recognizer.onend = () => {
      isListening = false;

      // Wake-word mode: keep the mic open by restarting, unless we're
      // pausing deliberately (e.g. while ARIA is speaking).
      if (wakeMode && !speaking) {
        try { recognizer.start(); } catch (e) { /* ignore double-start */ }
        return;
      }

      if (!wakeMode && orbStatus.textContent.indexOf('Listening') === 0) {
        setOrbState('idle', 'Tap to talk');
      }
    };

    recognizer.onresult = (event) => {
      const said = event.results[0][0].transcript;

      if (awaitingCommand) {
        awaitingCommand = false;
        handleUserInput(said);
        return;
      }

      if (wakeMode) {
        const command = stripWakePhrase(said);
        if (command === null) return; // wake word not heard, keep listening
        if (command.length > 0) {
          handleUserInput(command);
        } else {
          // "Hey Aria" with nothing after it — capture the next utterance
          awaitingCommand = true;
          setOrbState('listening', 'Yes? I\u2019m listening…');
        }
        return;
      }

      // Plain tap-to-talk mode
      handleUserInput(said);
    };

    orbBtn.onclick = () => {
      if (wakeMode) return; // orb is just a status light while wake mode is on
      if (isListening) {
        recognizer.stop();
        return;
      }
      window.speechSynthesis.cancel();
      try { recognizer.start(); } catch (e) { /* already started */ }
    };

    wakeSwitch.onclick = () => {
      wakeMode = !wakeMode;
      wakeSwitch.classList.toggle('on', wakeMode);
      if (wakeMode) {
        window.speechSynthesis.cancel();
        setOrbState('idle', 'Starting wake-word listening…');
        try { recognizer.start(); } catch (e) { /* ignore */ }
      } else {
        awaitingCommand = false;
        try { recognizer.stop(); } catch (e) { /* ignore */ }
        setOrbState('idle', 'Tap to talk');
      }
    };
  } else {
    orbStatus.textContent = 'Voice not supported in this browser — type below';
    orbBtn.disabled = true;
    orbBtn.style.opacity = '0.5';
    wakeSwitch.style.opacity = '0.4';
    wakeSwitch.style.pointerEvents = 'none';
  }

  // ---------- Text fallback ----------
  function sendTyped() {
    const val = textInput.value;
    if (!val.trim()) return;
    textInput.value = '';
    handleUserInput(val);
  }
  sendBtn.onclick = sendTyped;
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendTyped();
  });
})();
</script>
